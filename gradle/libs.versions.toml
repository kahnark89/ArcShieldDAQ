[versions]
agp                   = "8.9.1"
kotlin                = "2.0.21"
compose-bom           = "2024.12.01"
hilt                  = "2.52"
room                  = "2.6.1"
datastore             = "1.1.1"
kotlinx-serialization = "1.7.3"
kotlinx-coroutines    = "1.9.0"
security-crypto       = "1.1.0-alpha06"
okhttp                = "4.12.0"
polar-ble-sdk         = "5.6.0"
rxjava3               = "3.1.8"
camerax               = "1.4.1"
work                  = "2.10.0"
hilt-work             = "1.2.0"
junit                 = "4.13.2"

[libraries]
# Kotlin
kotlinx-coroutines-android      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",  version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json      = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json",  version.ref = "kotlinx-serialization" }

# AndroidX core
androidx-core-ktx               = { group = "androidx.core",         name = "core-ktx",                    version = "1.15.0" }
androidx-activity-compose       = { group = "androidx.activity",     name = "activity-compose",             version = "1.9.3" }
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle",    name = "lifecycle-runtime-ktx",        version = "2.8.7" }
androidx-lifecycle-runtime-compose  = { group = "androidx.lifecycle",    name = "lifecycle-runtime-compose",    version = "2.8.7" }
androidx-lifecycle-viewmodel        = { group = "androidx.lifecycle",    name = "lifecycle-viewmodel-compose",  version = "2.8.7" }

# Compose
compose-bom                     = { group = "androidx.compose",      name = "compose-bom",                  version.ref = "compose-bom" }
compose-ui                      = { group = "androidx.compose.ui",   name = "ui" }
compose-ui-graphics             = { group = "androidx.compose.ui",   name = "ui-graphics" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui",   name = "ui-tooling-preview" }
compose-material3               = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-tooling              = { group = "androidx.compose.ui",   name = "ui-tooling" }

# Hilt
hilt-android                    = { group = "com.google.dagger",     name = "hilt-android",                 version.ref = "hilt" }
hilt-compiler                   = { group = "com.google.dagger",     name = "hilt-android-compiler",        version.ref = "hilt" }
hilt-navigation-compose         = { group = "androidx.hilt",         name = "hilt-navigation-compose",      version = "1.2.0" }

# Room
room-runtime                    = { group = "androidx.room",         name = "room-runtime",                 version.ref = "room" }
room-ktx                        = { group = "androidx.room",         name = "room-ktx",                     version.ref = "room" }
room-compiler                   = { group = "androidx.room",         name = "room-compiler",                version.ref = "room" }

# DataStore
datastore-preferences           = { group = "androidx.datastore",    name = "datastore-preferences",        version.ref = "datastore" }

# Security
security-crypto                 = { group = "androidx.security",     name = "security-crypto",              version.ref = "security-crypto" }

# Network
okhttp                          = { group = "com.squareup.okhttp3",  name = "okhttp",                       version.ref = "okhttp" }

# Polar BLE SDK (research-grade HRV from H10 chest strap and Verity Sense armband).
# Hosted on JitPack — see settings.gradle.kts. The SDK exposes RxJava 3 Flowables;
# kotlinx-coroutines-rx3 bridges them to Kotlin Flow for the rest of the app.
polar-ble-sdk                   = { group = "com.github.polarofficial.polar-ble-sdk", name = "sdk",       version.ref = "polar-ble-sdk" }
rxjava3                         = { group = "io.reactivex.rxjava3", name = "rxjava",                       version.ref = "rxjava3" }
kotlinx-coroutines-rx3          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-rx3",      version.ref = "kotlinx-coroutines" }

# CameraX
camerax-core                    = { group = "androidx.camera",       name = "camera-core",                  version.ref = "camerax" }
camerax-camera2                 = { group = "androidx.camera",       name = "camera-camera2",               version.ref = "camerax" }
camerax-lifecycle               = { group = "androidx.camera",       name = "camera-lifecycle",             version.ref = "camerax" }
camerax-view                    = { group = "androidx.camera",       name = "camera-view",                  version.ref = "camerax" }

# WorkManager + Hilt integration
work-runtime-ktx                = { group = "androidx.work",         name = "work-runtime-ktx",             version.ref = "work" }
hilt-work                       = { group = "androidx.hilt",         name = "hilt-work",                    version.ref = "hilt-work" }
hilt-work-compiler              = { group = "androidx.hilt",         name = "hilt-compiler",                version.ref = "hilt-work" }

# Test (JVM unit tests under app/src/test/)
junit                           = { group = "junit",                 name = "junit",                        version.ref = "junit" }
kotlinx-coroutines-test         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",      version.ref = "kotlinx-coroutines" }

[plugins]
android-application   = { id = "com.android.application",                version.ref = "agp" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",            version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler      = { id = "org.jetbrains.kotlin.plugin.compose",    version.ref = "kotlin" }
hilt                  = { id = "com.google.dagger.hilt.android",          version.ref = "hilt" }
ksp                   = { id = "com.google.devtools.ksp",                 version = "2.0.21-1.0.28" }
